name: Deploy database migrations

on:
  push:
    branches: [staging, main]
    paths:
      - "supabase/migrations/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pick target project for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "project_ref=tgpzxgrvdmmwnodxrooh" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "project_ref=vgrxsdjfrkmpmpqvuqty" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Link ${{ steps.target.outputs.env_name }} project
        run: supabase link --project-ref ${{ steps.target.outputs.project_ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
